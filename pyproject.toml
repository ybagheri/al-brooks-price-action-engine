[build-system]
# setuptools>=77 is required for the SPDX `license` string and `license-files`
# used below; older versions only understand the deprecated table form and the
# license classifier. Both spellings stop being supported after 2027-Feb-18.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "albrooks"
version = "0.1.0"
description = "A production-grade, extensible, platform-independent Al Brooks Price Action analysis engine"
readme = "README.md"
requires-python = ">=3.10"
# SPDX expression rather than `license = {file = ...}` plus a trove classifier:
# the old form is deprecated and stops being supported after 2027-Feb-18.
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yaser Bagheri", email = "ybagheir83@gmail.com" }
]
keywords = [
    "trading",
    "price action",
    "al brooks",
    "technical analysis",
    "algorithmic trading",
    "quantitative research"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    # `tomllib` is standard library from 3.11 only, and the CI matrix includes
    # 3.10. A test that reads pyproject.toml must keep working there, because
    # `importorskip` would turn a checked security property into a silent no-op
    # on exactly one version -- which is the failure mode that file exists to
    # avoid. `tomli` is the reference backport and is dev-only, so the
    # zero-runtime-dependency property is untouched.
    "tomli>=2.0.0; python_version < '3.11'",
]
pandas = [
    "pandas>=2.0.0",
]

pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
files = ["src/albrooks"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
# Numeric results are inherently float-typed; the engine is not a numeric
# library and strict promotion warnings add noise without catching real bugs.
disallow_any_generics = false

# `MetaTrader5` is handled here rather than with an inline `# type: ignore`,
# and the reason is that the two environments disagree about *which* error the
# import produces.
#
# A developer machine with a terminal installed has the module present and
# untyped, so mypy reports `import-untyped`. CI does not install it, so mypy
# reports `import-not-found`. An inline ignore can only name one code, so with
# `warn_unused_ignores = true` the same line passes locally and **fails CI** --
# and it failed on all three matrix versions, which is what a version-independent
# error looks like.
#
# An override is indifferent to which of the two it is, so there is no ignore
# left to become unused. The scope stays this one module on purpose: silencing it
# package-wide would remove the check from the code that most needs it, and
# `feed.py` is duck-typed through `_MT5Module` regardless.
[[tool.mypy.overrides]]
module = ["MetaTrader5"]
ignore_missing_imports = true
