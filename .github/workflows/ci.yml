name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    # Third-party actions are pinned to a full commit SHA, not to a version tag.
    # A tag is a mutable pointer: `v4` can be moved to a different commit later,
    # and a compromised action repository could publish a new one that this
    # workflow would then run with no visible change in the diff. A SHA names
    # one commit and cannot be repointed, so the version is kept in a comment
    # for the next person who needs to bump it.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run Ruff Linter
      run: |
        ruff check .

    - name: Run mypy type checks
      run: |
        mypy

    - name: Run Pytest Suite
      run: |
        pytest

    - name: Verify core has no MT5 dependency
      run: |
        python scripts/check_no_mt5_dependency.py

    - name: Verify required documentation exists
      run: |
        python scripts/check_docs_present.py

    # The MQL5 port is complete, so the shipped state is AGREED: all three
    # cases name a real sidecar, every declared leaf agrees, and the worst
    # relative deviation is 0.0.
    #
    # There is deliberately NO softening flag here, and that is the claim this
    # step makes. `--allow-partial` is gone because it has nothing left to
    # suppress: `AB_PORTED_GROUPS` in `mql5/Include/AlBrooks/Parity.mqh` now
    # names every group in `SCOPE`, so there is no group a disagreement could
    # land outside of. `--allow-unverified` went one state earlier, for the
    # same reason. A flag that does nothing is worse than no flag, because a
    # reader assumes it is load-bearing.
    #
    # An unflagged run exits non-zero on any disagreement, which is what makes
    # this step able to fail at all. `test_the_ci_flag_matches_the_shipped_state`
    # links the absence of the flags to the shipped state in both directions,
    # so parity regressing -- or a case silently going un-compared -- fails the
    # suite rather than needing to be noticed. The gate's own ability to catch
    # a regression is still asserted separately, by
    # `test_allow_partial_does_not_suppress_a_regression`.
    - name: Run the Python / MQL5 parity harness
      run: |
        python -m tests.parity.runner

    - name: Verify package builds
      run: |
        pip install build
        python -m build --wheel --outdir dist/
