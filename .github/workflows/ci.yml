name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run Ruff Linter
      run: |
        ruff check .

    - name: Run mypy type checks
      run: |
        mypy

    - name: Run Pytest Suite
      run: |
        pytest

    - name: Verify core has no MT5 dependency
      run: |
        python scripts/check_no_mt5_dependency.py

    - name: Verify required documentation exists
      run: |
        python scripts/check_docs_present.py

    # Parity currently reports UNVERIFIED: no MQL5 build exists yet, so nothing
    # has been compared and there is no parity claim to keep honest. The flag
    # exists for exactly that period, and
    # `tests/unit/test_phase20_parity.py::test_the_unverified_scaffold_stays_in_step_with_ci`
    # fails if it is still here once the first real sidecar lands. Phase 21
    # removes this step's flag along with the scaffolding.
    - name: Run the Python / MQL5 parity harness
      run: |
        python -m tests.parity.runner --allow-unverified

    - name: Verify package builds
      run: |
        pip install build
        python -m build --wheel --outdir dist/
