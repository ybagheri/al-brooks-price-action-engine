name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    # Third-party actions are pinned to a full commit SHA, not to a version tag.
    # A tag is a mutable pointer: `v4` can be moved to a different commit later,
    # and a compromised action repository could publish a new one that this
    # workflow would then run with no visible change in the diff. A SHA names
    # one commit and cannot be repointed, so the version is kept in a comment
    # for the next person who needs to bump it.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run Ruff Linter
      run: |
        ruff check .

    - name: Run mypy type checks
      run: |
        mypy

    - name: Run Pytest Suite
      run: |
        pytest

    - name: Verify core has no MT5 dependency
      run: |
        python scripts/check_no_mt5_dependency.py

    - name: Verify required documentation exists
      run: |
        python scripts/check_docs_present.py

    # The MQL5 port is partial, so the shipped state is FAILED: one real sidecar
    # exists and disagrees on the groups the port has not written yet.
    #
    # `--allow-partial` suppresses exactly that and nothing else. A disagreement
    # inside a group the sidecar declares as `ported` is a regression and still
    # fails the build; a sidecar with no `ported` declaration is treated as
    # claiming nothing, so deleting the key is not a way to switch this off.
    #
    # It replaces `--allow-unverified`, which covered the previous state where
    # nothing had been compared at all. Both were scaffolding for a phase that
    # had not produced a build; this one is scaffolding for a port that is half
    # written, which is a different thing and is checked differently.
    #
    # `tests/unit/test_phase20_parity.py::test_the_ci_flag_matches_the_shipped_state`
    # links this flag to the shipped state in both directions, so parity becoming
    # established -- or this port regressing -- fails the suite rather than
    # needing to be noticed.
    - name: Run the Python / MQL5 parity harness
      run: |
        python -m tests.parity.runner --allow-partial

    - name: Verify package builds
      run: |
        pip install build
        python -m build --wheel --outdir dist/
